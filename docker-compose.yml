services:
  falcon:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      FALCON_DATA_DIR: /opt/falcon/data
      FALCON_REVIEW_THRESHOLD: "0.86"
      FALCON_HIGH_THRESHOLD: "0.94"
    volumes:
      - falcon-data:/opt/falcon/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  falcon-data:
